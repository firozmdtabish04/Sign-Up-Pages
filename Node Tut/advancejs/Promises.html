<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promises</title>
  </head>

  <body>
    <h1>Promises</h1>

    <script>
      let promise = new Promise((resolve, reject) => {
        let success = true;

        if (success) {
          resolve("Promise completed successfully");
        } else {
          reject("Promise failed");
        }
      });

      promise
        .then((result) => {
          console.log(result);
        })
        .catch((error) => {
          console.log(error);
        });
    </script>
  </body>
</html>
