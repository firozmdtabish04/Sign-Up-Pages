  <body>
    <h2>OOP</h2>
    <script>
      class Student {
        constructor(name, age, course) {
          this.name = name;
          this.age = age;
          this.course = course;
        }

        display() {
          console.log(this.name);
          console.log(this.age);
          console.log(this.course);
        }
      }

      let student1 = new Student("Akhil", 23, "B.Tech");
      let student2 = new Student("Akhil", 23, "B.Tech");

      student1.display();
      student1.display();
    </script>
  </body>
