<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Encapsulation</h1>
    <script>
      class Bank {
        #balance = 0;

        deposit(amount) {
          this.#balance += amount;
        }

        getBalance() {
          return this.#balance;
        }
      }

      let account = new Bank();

      account.deposit(5000);

      console.log(account.getBalance());
    </script>
  </body>
</html>
