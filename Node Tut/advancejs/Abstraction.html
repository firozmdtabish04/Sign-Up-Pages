<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Abstraction</h1>
    <script>
      class Car {
        start() {
          this.#startEngine();
          console.log("Car started");
        }

        #startEngine() {
          console.log("Engine started");
        }
      }

      let car = new Car();

      car.start();
    </script>
  </body>
</html>
