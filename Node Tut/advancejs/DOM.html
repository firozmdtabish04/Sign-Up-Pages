<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM</title>
  </head>

  <body>
    <h1 id="heading">Hello World</h1>

    <button onclick="changeText()">Click Me</button>

    <script>
      function changeText() {
        document.getElementById("heading").innerHTML = "Hello Akhil!";
      }
    </script>
  </body>
</html>
